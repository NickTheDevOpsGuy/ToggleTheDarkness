<!-- ToggleTheDarkness – icon only -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ToggleTheDarkness icon">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0f1222"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#g)"/>
  <g transform="translate(64,64)">
    <rect x="-36" y="-18" width="72" height="36" rx="18" fill="#0b1020" stroke="#272C3F" stroke-width="2"/>
    <g filter="url(#gl)">
      <circle id="k" cx="-18" cy="0" r="15" fill="#A78BFA"/>
    </g>
    <circle cx="-26" cy="0" r="8" fill="#C3DAFE"/>
    <circle cx="-20" cy="-2" r="8" fill="#0f1222"/>
    <circle cx="26" cy="0" r="7" fill="#FFD166"/>
  </g>
</svg>